name: Bug report
description: Report incorrect behavior or a reproducible failure
title: "[bug] "
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include a minimal reproduction and observed output.
    validations:
      required: true
  - type: input
    attributes:
      label: Version
      placeholder: 0.1.0
  - type: textarea
    attributes:
      label: Environment
      description: Python version, OS, and relevant package versions.
